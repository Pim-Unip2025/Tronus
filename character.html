<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">

<title>Criar Personagem</title>

</head>

<body>

<div id="sky"></div>

<main class="container character-container">

<!-- BARRA DE PROGRESSO -->

<div class="progress-bar">

<div class="progress-step active">
<div class="circle">1</div>
<p>Gênero</p>
</div>

<div class="progress-step">
<div class="circle">2</div>
<p>Nome</p>
</div>

<div class="progress-step">
<div class="circle">3</div>
<p>Personagem</p>
</div>


</div>

<!-- PASSO 1 -->

<div class="step active" id="step1">

<h2>Escolha seu gênero</h2>

<div class="gender-buttons">

<button class="login" onclick="selectGender('male')">
Masculino
</button>

<button class="login" onclick="selectGender('female')">
Feminino
</button>

</div>

</div>

<!-- PASSO 2 -->

<div class="step" id="step2">

<h2>Nome do personagem</h2>

<div class="input-box">
<input id="username" placeholder="Nome do personagem" maxlength="60" aria-label="Nome do personagem">
</div>

<p id="nomeMsg" class="form-msg" role="alert"></p>

<button class="login" onclick="confirmarNome()">
Continuar
</button>

</div>

<!-- PASSO 3 -->

<div class="step" id="step3">

<h2>Escolha seu personagem</h2>

<div id="characters" class="characters"></div>

</div>

<!-- PASSO 4 -->

<div class="step" id="step4">

<h2>Ficha do Personagem</h2>

<div class="character-sheet">

<div class="sheet-avatar">
<img id="previewImage" alt="Avatar escolhido">
</div>

<div class="sheet-info">

<p id="playerName"></p>
<p id="playerEmail"></p>
<p class="form-dica">O nome e a aparência não podem ser trocados depois.</p>
<p id="criarMsg" class="form-msg" role="alert"></p>

<button class="login" id="btnCriar" onclick="criarPersonagem()">
Iniciar jornada
</button>

<button class="login secundario" style="margin-top:8px" onclick="nextStep(3)">
Trocar aparência
</button>

</div>

</div>

</div>

</div>

</main>

<script src="js/script.js"></script>
<script src="js/api.js"></script>
<script src="js/personagem.js"></script>

</body>
</html>
