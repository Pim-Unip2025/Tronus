<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <title>Redefinir Senha - TRONUS</title>
</head>

<body>

<div id="sky"></div>

<main class="container">

  <!-- ETAPA 1: informar o celular -->
  <form id="step1">

    <img src="img/logo.png" class="logo" alt="Tronus">

    <p class="form-dica">Só para alunos. Professores e administradores pedem a nova senha ao administrador.</p>
    <p id="msg1" class="form-msg" role="alert"></p>

    <div class="input-box">
      <input id="celularInput" placeholder="Número de celular" type="tel" autocomplete="tel" aria-label="Celular">
      <i class='bx bx-phone'></i>
    </div>

    <button type="submit" class="login" id="btnEnviar">Gerar código</button>

    <div class="register-link">
      <p><a href="login.html">Voltar ao login</a></p>
    </div>

  </form>

  <!-- ETAPA 2: código + nova senha -->
  <form id="step2" style="display:none;">

    <img src="img/logo.png" class="logo" alt="Tronus">

    <p class="form-dica" id="textoCodigo">Digite o código de 6 dígitos que você recebeu. Ele vale por 10 minutos.</p>
    <p id="msg2" class="form-msg" role="alert"></p>

    <div class="input-box">
      <input id="codigoInput" placeholder="Código de 6 dígitos" type="text" inputmode="numeric" maxlength="6" aria-label="Código">
      <i class='bx bx-key'></i>
    </div>

    <div class="input-box">
      <input id="novaSenha" placeholder="Nova senha" type="password" autocomplete="new-password" aria-label="Nova senha">
      <i class='bx bx-lock-alt'></i>
    </div>

    <div class="input-box">
      <input id="confirmarSenha" placeholder="Confirmar nova senha" type="password" autocomplete="new-password" aria-label="Confirmar nova senha">
      <i class='bx bx-lock-alt'></i>
    </div>

    <button type="submit" class="login" id="btnSalvar">Salvar senha</button>

  </form>

  <!-- ETAPA 3: pronto -->
  <div id="step3" style="display:none;">
    <img src="img/logo.png" class="logo" alt="Tronus">
    <p class="form-msg form-msg--ok">Senha redefinida! Agora é só entrar com a nova senha.</p>
    <a class="login botao-link" href="login.html">Ir para o login</a>
  </div>

</main>

<script src="js/script.js"></script>
<script src="js/api.js"></script>
<script>
  let resetToken = null;

  function mostrarEtapa(n) {
    ["step1", "step2", "step3"].forEach((id, i) => {
      document.getElementById(id).style.display = i + 1 === n ? "block" : "none";
    });
  }

  // ETAPA 1 — a API gera o código e um reset_token de uso único
  document.getElementById("step1").addEventListener("submit", async (e) => {
    e.preventDefault();
    const msg = document.getElementById("msg1");
    const celular = document.getElementById("celularInput").value.replace(/\D/g, "");

    if (celular.length < 10 || celular.length > 11) {
      mostrarMensagem(msg, "Celular inválido. Use DDD + número (10 ou 11 dígitos).");
      return;
    }

    try {
      const r = await comCarregando(document.getElementById("btnEnviar"), () => api.esqueciSenha(celular), "Gerando...");
      resetToken = r.reset_token;
      // Enquanto não há SMS de verdade, a API pode devolver o código (SIMULAR_SMS=true).
      if (r.codigo) {
        document.getElementById("textoCodigo").innerHTML =
          `Modo de teste (sem SMS). Seu código é <strong class="codigo-simulado">${escapar(r.codigo)}</strong>`;
      }
      mostrarMensagem(msg, "");
      mostrarEtapa(2);
    } catch (erro) {
      mostrarMensagem(msg, erro.message);
    }
  });

  // ETAPA 2 — troca a senha
  document.getElementById("step2").addEventListener("submit", async (e) => {
    e.preventDefault();
    const msg = document.getElementById("msg2");
    const codigo = document.getElementById("codigoInput").value.trim();
    const novaSenha = document.getElementById("novaSenha").value;
    const confirmar = document.getElementById("confirmarSenha").value;

    if (!/^\d{6}$/.test(codigo)) return mostrarMensagem(msg, "Informe o código de 6 dígitos.");
    if (novaSenha !== confirmar) return mostrarMensagem(msg, "As senhas não conferem.");

    try {
      await comCarregando(
        document.getElementById("btnSalvar"),
        () => api.redefinirSenha(resetToken, codigo, novaSenha),
        "Salvando...",
      );
      mostrarEtapa(3);
    } catch (erro) {
      mostrarMensagem(msg, erro.message);
    }
  });
</script>

</body>
</html>
