<!DOCTYPE html>
<html lang="pt-br">

<head>
  <link rel="stylesheet" href="css/sidebar.css">
  <link rel="stylesheet" href="css/reinos.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/theme.css">
  <link href="https://fonts.googleapis.com/css2?family=MedievalSharp&family=Cinzel:wght@400;600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <title>Reinos - TRONUS</title>
  <link rel="stylesheet" href="css/comum.css">
</head>

<body>
<div id="sky"></div>

  <!-- TOPO -->
  <div class="topbar">
    <div class="player-info">
      <img class="player-avatar" id="avatarImg" src="" alt="Avatar">
      <div class="player-details">
        <span class="player-name" id="playerName">—</span>
        <span class="player-title" id="playerTitle">Plebeu</span>
      </div>
    </div>

    <div class="player-stats">
      <div class="stars-count">
        <i class='bx bxs-star'></i>
        <span id="totalEstrelas">0</span> estrelas
      </div>
      <div class="progress-wrap">
        <span class="progress-label" id="progressLabel">0 / 45 para Rei</span>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="progressFill" style="width: 0%"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- TÍTULO -->
  <div class="page-title">
    <h1>⚔️ REINOS</h1>
    <p>Conquiste os reinos e avance em sua jornada</p>
  </div>

  <!-- REINOS -->
  <div class="reinos-grid" id="reinosGrid"></div>

  <script src="js/script.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/api.js"></script>

  <script>
    Sessao.exigir("aluno");

    // Ícone de cada reino (fallback em emoji se não houver imagem)
    const reinoIcones = {
      "Python":                 "img/python.png",
      "C++":                    "img/c++.png",
      "Engenharia de Software": "img/soft.png",
      "Banco de Dados":         "img/bd.png",
      "Redes":                  "img/redes.png",
    };
    const reinoEmojis = {
      "Python": "🐍", "C++": "⚙️", "Engenharia de Software": "📐", "Banco de Dados": "🗄️", "Redes": "🌐",
    };

    // Limiar do próximo título. A fonte da verdade é o banco; aqui é só a barra.
    const PROXIMO = { Plebeu: ["Cavaleiro", 15], Cavaleiro: ["Duque", 30], Duque: ["Rei", 45], Rei: null };

    async function carregar() {
      const grid = document.getElementById("reinosGrid");
      let personagem;
      try {
        personagem = await api.meuPersonagem();
      } catch (erro) {
        if (erro.status === 404) return window.location.replace("character.html");
        grid.innerHTML = `<p class="reinos-erro">${escapar(erro.message)}</p>`;
        return;
      }

      // Topo
      document.getElementById("avatarImg").src = personagem.avatar;
      document.getElementById("playerName").textContent = personagem.nome;
      document.getElementById("playerTitle").textContent = personagem.titulo_atual;
      document.getElementById("totalEstrelas").textContent = personagem.total_estrelas;

      const prox = PROXIMO[personagem.titulo_atual];
      const meta = prox ? prox[1] : 45;
      document.getElementById("progressFill").style.width = Math.min((personagem.total_estrelas / meta) * 100, 100) + "%";
      document.getElementById("progressLabel").textContent = prox
        ? `${personagem.total_estrelas} / ${meta} para ${prox[0]}`
        : "Todos os Reinos dominados!";

      try {
        const [reinos, progresso] = await Promise.all([api.reinos(), api.meuProgresso()]);

        // "Em breve" = a primeira fase do Reino ainda não tem perguntas.
        const temQuestoes = await Promise.all(
          reinos.map(async (r) => {
            const primeira = progresso.find((p) => p.reino_id === r.id && p.ordem === 1);
            if (!primeira) return false;
            try {
              return (await api.questoes(primeira.fase_id)).length > 0;
            } catch {
              return true; // na dúvida, deixa entrar; a trilha trata
            }
          }),
        );

        grid.innerHTML = "";
        reinos.forEach((reino, i) => {
          const fases = progresso.filter((p) => p.reino_id === reino.id);
          const estrelas = fases.reduce((s, f) => s + f.estrelas, 0);
          const max = fases.length * 3;
          const disponivel = temQuestoes[i];

          const card = document.createElement(disponivel ? "button" : "div");
          card.classList.add("reino-card");
          if (!disponivel) card.classList.add("em-breve");

          const icone = reinoIcones[reino.nome];
          card.innerHTML = `
            ${icone
              ? `<img class="reino-icone" src="${escapar(icone)}" alt="">`
              : `<div class="reino-icone-placeholder">${reinoEmojis[reino.nome] || "⚔️"}</div>`}
            <div class="reino-nome">${escapar(reino.nome)}</div>
            <div class="reino-progresso">${disponivel ? `${estrelas} / ${max} ⭐` : "Questões em desenvolvimento"}</div>
            ${disponivel ? "" : `<div class="reino-badge-breve">✦ Em Breve</div>`}
          `;
          if (disponivel) {
            card.type = "button";
            card.onclick = () => (window.location.href = `trilha.html?reino=${reino.id}`);
          }
          grid.appendChild(card);
        });
      } catch (erro) {
        grid.innerHTML = `<p class="reinos-erro">${escapar(erro.message)}</p>`;
      }
    }

    carregar();
  </script>
  <script src="js/sidebar.js"></script>

</body>

</html>
