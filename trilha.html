<!DOCTYPE html>
<html lang="pt-br">

<head>
  <link rel="stylesheet" href="css/sidebar.css">
  <link rel="stylesheet" href="css/trilha.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/theme.css">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <title>Trilha · Tronus</title>
  <meta name="description" content="Tronus: plataforma gamificada da UNIP em que cada matéria é um Reino. Responda quizzes, ganhe estrelas e suba de Plebeu a Rei.">
  <meta name="theme-color" content="#1e1308">
  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <link rel="stylesheet" href="css/comum.css">
</head>


<body>

  <!-- TOPO -->
  <div class="topbar">
    <button class="back-btn" onclick="window.location.href='reinos.html'">← Voltar</button>
    <span class="topbar-title" id="reinoNome">—</span>
    <span class="topbar-sub" id="reinoProgresso">0 / 9 ⭐</span>
    <button class="dashboard-btn" onclick="window.location.href='dashboard.html'" title="Análise de Desempenho">
      <i class='bx bx-bar-chart-alt-2'></i> Análise
    </button>
  </div>

  <!-- TRILHA -->
  <div class="trilha-wrap" id="trilhaWrap"></div>

  <!-- ═══════════════════════════════════════════
       MODAL DE QUIZ
  ═══════════════════════════════════════════ -->
  <div class="modal-overlay" id="modalQuizOverlay">
    <div class="modal modal-quiz">

      <button class="btn-fechar-quiz" onclick="fecharQuiz()" title="Fechar">✕</button>

      <div class="quiz-header">
        <span class="quiz-fase-nome" id="quizFaseNome">Fase 1</span>
        <span class="quiz-prog-texto" id="quizProgressText">Questão 1 de 5</span>
      </div>
      <div class="quiz-progress-bar-bg">
        <div class="quiz-progress-bar-fill" id="quizProgressFill" style="width:0%"></div>
      </div>

      <div class="quiz-question" id="quizQuestion"></div>
      <div class="quiz-alternativas" id="quizAlternativas"></div>
      <div class="quiz-feedback" id="quizFeedback"></div>
      <button class="btn-proximo" id="btnProximo" style="display:none">Próxima →</button>

      <div class="quiz-score" id="quizScore" style="display:none">
        <div class="score-stars" id="scoreStars"></div>
        <div class="score-text"  id="scoreText"></div>
        <button class="btn-confirmar" onclick="fecharQuiz()">Concluir</button>
      </div>

    </div>
  </div>

  <!-- ═══════════════════════════════════════════
       MODAL LIBRAS
  ═══════════════════════════════════════════ -->
  <div class="modal-overlay" id="modalLibras">
    <div class="modal modal-libras">
      <button class="btn-fechar-quiz" onclick="fecharLibras()" title="Fechar">✕</button>
      <h2 class="libras-titulo">👋 Glossário LIBRAS — Tecnologia da Informação</h2>
      <p class="libras-sub">Termos essenciais de TI em Língua Brasileira de Sinais</p>
      <div class="libras-grid" id="librasGrid"></div>
      <p class="libras-referencia">
        Referência:
        <a href="https://www.spreadthesign.com/pt.br/search/" target="_blank" rel="noopener">
          Spread The Sign — Dicionário de LIBRAS ↗
        </a>
      </p>
    </div>
  </div>

  <!-- Toast "Em Breve" -->
  <div id="toastEmBreve" style="
    display:none; position:fixed; bottom:36px; left:50%;
    transform:translateX(-50%);
    background:rgba(20,10,0,0.95); border:1px solid rgba(212,175,55,0.4);
    color:#d4af37; padding:14px 28px; border-radius:14px;
    font-family:'Cinzel',serif; font-size:13px; letter-spacing:1px;
    z-index:9999; text-align:center; backdrop-filter:blur(8px);
    box-shadow:0 4px 20px rgba(0,0,0,0.5); pointer-events:none;
  ">✦ Questões em desenvolvimento — em breve!</div>

  <!-- Botão flutuante LIBRAS -->
  <button class="libras-fab" onclick="abrirLibras()" title="Acessibilidade — Glossário LIBRAS">
    <span class="libras-fab-icon">👋</span>
    <span class="libras-fab-texto">LIBRAS</span>
  </button>

  <script src="js/theme.js"></script>
  <script src="js/api.js"></script>
  <script src="js/sidebar.js"></script>
  <script>
    Sessao.exigir("aluno");

    const reinoId = Number(new URLSearchParams(location.search).get("reino"));
    let reinoAtual = null; // { id, nome, fases: [{ id, nome, ordem, estrelas }] }

    // Estado do quiz. As respostas só vão para a API no fim da fase: é o
    // servidor que corrige (o aluno nem recebe qual alternativa é a certa).
    const quiz = { fase: null, questoes: [], index: 0, escolhas: {} };

    // ── Inicialização ────────────────────────────────────────
    async function carregarTrilha() {
      if (!reinoId) return window.location.replace("reinos.html");
      if (!reinoAtual) document.getElementById("trilhaWrap").innerHTML = esqueletos(3, "fase-circulo");
      try {
        const [reinos, fases, progresso] = await Promise.all([api.reinos(), api.fases(reinoId), api.meuProgresso()]);
        const reino = reinos.find((r) => r.id === reinoId);
        if (!reino) return window.location.replace("reinos.html");

        reinoAtual = {
          id: reino.id,
          nome: reino.nome,
          fases: fases.map((f) => ({
            ...f,
            estrelas: progresso.find((p) => p.fase_id === f.id)?.estrelas ?? 0,
          })),
        };

        document.getElementById("reinoNome").textContent = reino.nome;
        const total = reinoAtual.fases.reduce((s, f) => s + f.estrelas, 0);
        document.getElementById("reinoProgresso").textContent = `${total} / ${reinoAtual.fases.length * 3} ⭐`;
        renderTrilha(reinoAtual);
      } catch (erro) {
        if (erro.status === 404) return window.location.replace("character.html");
        document.getElementById("trilhaWrap").innerHTML = `<p class="trilha-erro">${escapar(erro.message)}</p>`;
      }
    }

    // ── Renderiza trilha ─────────────────────────────────────
    // A fase seguinte abre quando a anterior tem ao menos 1 estrela.
    function renderTrilha(reino) {
      const wrap = document.getElementById("trilhaWrap");
      wrap.innerHTML = "";

      // Cabeçalho do Reino: arte, nome e progresso
      const ICONES = { "Python": "img/python.png", "C++": "img/c++.png", "Engenharia de Software": "img/soft.png", "Banco de Dados": "img/bd.png", "Redes": "img/redes.png" };
      const total = reino.fases.reduce((s, f) => s + f.estrelas, 0);
      const max = reino.fases.length * 3;
      const cab = document.createElement("div");
      cab.className = "trilha-cabecalho";
      cab.innerHTML = `
        ${ICONES[reino.nome] ? `<img class="trilha-arte" src="${escapar(ICONES[reino.nome])}" alt="">` : ""}
        <div class="trilha-info">
          <span class="trilha-tag">Reino</span>
          <h1 class="trilha-nome">${escapar(reino.nome)}</h1>
          <div class="trilha-barra"><div style="width:${max ? (total / max) * 100 : 0}%"></div></div>
          <span class="trilha-meta">${total} de ${max} estrelas · ${total === max ? "Reino dominado! 👑" : "conquiste as 3 fases para dominar o Reino"}</span>
        </div>`;
      wrap.appendChild(cab);

      reino.fases.forEach((fase, index) => {
        const desbloqueada = index === 0 || reino.fases[index - 1].estrelas > 0;
        const item = document.createElement("div");
        item.classList.add("fase-item");
        if (!desbloqueada) item.classList.add("fase-item-bloqueada");

        const circulo = document.createElement(desbloqueada ? "button" : "div");
        circulo.classList.add("fase-circulo");
        if (!desbloqueada) circulo.classList.add("bloqueada");
        if (fase.estrelas === 3) circulo.classList.add("completa");

        if (desbloqueada) {
          circulo.type = "button";
          circulo.setAttribute("aria-label", `Jogar ${fase.nome}`);
          circulo.innerHTML = `<span class="fase-numero">${index + 1}</span>`;
          circulo.onclick = () => abrirQuiz(fase);
        } else {
          circulo.setAttribute("aria-label", `${fase.nome} bloqueada`);
          circulo.innerHTML = `<span class="fase-lock" aria-hidden="true">🔒</span>`;
        }

        const situacao = !desbloqueada
          ? "Conquiste ao menos 1 estrela na fase anterior"
          : fase.estrelas === 3 ? "Fase conquistada"
          : fase.estrelas > 0 ? "Jogue de novo para chegar a 3 estrelas"
          : "Disponível — toque para jogar";

        const info = document.createElement("div");
        info.className = "fase-info";
        info.innerHTML = `
          <div class="fase-label">${escapar(fase.nome)}</div>
          <div class="fase-estrelas" aria-label="${fase.estrelas} de 3 estrelas">
            ${[0, 1, 2].map((i) => `<i class='${i < fase.estrelas ? "ativa" : ""}'>★</i>`).join("")}
          </div>
          <div class="fase-situacao">${situacao}</div>`;
        if (desbloqueada) info.onclick = () => abrirQuiz(fase);

        item.append(circulo, info);
        wrap.appendChild(item);
      });
    }

    // ── Toast Em Breve ───────────────────────────────────────
    function mostrarEmBreve(texto = "✦ Questões em desenvolvimento — em breve!") {
      const t = document.getElementById("toastEmBreve");
      t.textContent = texto;
      t.style.display = "block";
      setTimeout(() => { t.style.display = "none"; }, 3000);
    }

    // ── Abre quiz ────────────────────────────────────────────
    async function abrirQuiz(fase) {
      let questoes;
      try {
        questoes = await api.questoes(fase.id);
      } catch (erro) {
        return mostrarEmBreve(erro.message);
      }
      if (!questoes.length) return mostrarEmBreve();

      Object.assign(quiz, { fase, questoes, index: 0, escolhas: {} });
      document.getElementById("quizFaseNome").textContent = fase.nome;
      document.getElementById("quizScore").style.display = "none";
      document.getElementById("modalQuizOverlay").classList.add("ativo");
      renderQuestao();
    }

    function renderQuestao() {
      const q = quiz.questoes[quiz.index];
      const total = quiz.questoes.length;

      document.getElementById("quizProgressText").textContent = `Questão ${quiz.index + 1} de ${total}`;
      document.getElementById("quizProgressFill").style.width = (quiz.index / total) * 100 + "%";
      document.getElementById("quizQuestion").textContent = q.enunciado;
      document.getElementById("quizFeedback").textContent = "";
      document.getElementById("quizFeedback").className = "quiz-feedback";
      document.getElementById("quizScore").style.display = "none";
      document.getElementById("quizQuestion").style.display = "block";
      document.getElementById("quizAlternativas").style.display = "flex";

      const altContainer = document.getElementById("quizAlternativas");
      altContainer.innerHTML = "";
      q.alternativas.forEach((alt) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.classList.add("quiz-alt-btn");
        if (quiz.escolhas[q.id] === alt.id) btn.classList.add("alt-escolhida");
        btn.setAttribute("aria-pressed", String(quiz.escolhas[q.id] === alt.id));
        btn.innerHTML = `<span class="alt-letra">${escapar(alt.letra)}</span><span class="alt-texto">${escapar(alt.texto)}</span>`;
        btn.onclick = () => escolher(q, alt);
        altContainer.appendChild(btn);
      });

      const btnProx = document.getElementById("btnProximo");
      const ultima = quiz.index === total - 1;
      btnProx.style.display = "block";
      btnProx.disabled = quiz.escolhas[q.id] === undefined;
      btnProx.textContent = ultima ? "Enviar respostas" : "Próxima →";
      btnProx.onclick = ultima ? enviarRespostas : proximaQuestao;
    }

    function escolher(q, alt) {
      quiz.escolhas[q.id] = alt.id;
      renderQuestao();
    }

    function proximaQuestao() {
      quiz.index++;
      renderQuestao();
    }

    // ── Envia e mostra o resultado corrigido pela API ────────
    async function enviarRespostas() {
      const btn = document.getElementById("btnProximo");
      const respostas = quiz.questoes.map((q) => ({ questaoId: q.id, alternativaId: quiz.escolhas[q.id] }));
      let r;
      try {
        r = await comCarregando(btn, () => api.responderFase(quiz.fase.id, respostas), "Corrigindo...");
      } catch (erro) {
        const fb = document.getElementById("quizFeedback");
        fb.textContent = erro.message;
        fb.className = "quiz-feedback feedback-errado";
        return;
      }
      mostrarResultado(r);
    }

    function mostrarResultado(r) {
      document.getElementById("quizQuestion").style.display = "none";
      document.getElementById("quizAlternativas").style.display = "none";
      document.getElementById("quizFeedback").textContent = "";
      document.getElementById("btnProximo").style.display = "none";
      document.getElementById("quizProgressFill").style.width = "100%";

      let estrelasHtml = "";
      for (let i = 0; i < 3; i++) estrelasHtml += `<i class='bx bxs-star ${i < r.estrelas ? "ativa" : ""}'></i>`;
      document.getElementById("scoreStars").innerHTML = estrelasHtml;

      const msgs = [
        "Não desanime! Revise e tente novamente! 💪",
        "Bom começo! Continue treinando! ⚔️",
        "Quase lá! Mais um esforço! 🌟",
        "Excelente! Fase conquistada! 🏆",
      ];

      const textoAlt = (questaoId, altId) => {
        const alt = quiz.questoes.find((q) => q.id === questaoId)?.alternativas.find((a) => a.id === altId);
        return alt ? `(${escapar(alt.letra)}) ${escapar(alt.texto)}` : "—";
      };
      const correcao = r.correcao
        .map((c, i) => {
          const q = quiz.questoes.find((x) => x.id === c.questao_id);
          return `<li class="${c.acertou ? "corr-ok" : "corr-erro"}">
              <strong>${c.acertou ? "✓" : "✗"} ${i + 1}. ${escapar(q?.enunciado)}</strong>
              ${c.acertou ? "" : `<span>Sua resposta: ${textoAlt(c.questao_id, c.alternativa_escolhida_id)}</span>`}
              <span>Correta: ${textoAlt(c.questao_id, c.alternativa_correta_id)}</span>
            </li>`;
        })
        .join("");

      const melhor = r.melhor_estrelas > r.estrelas ? `<br><small>Sua melhor marca nesta fase continua ${r.melhor_estrelas} ⭐</small>` : "";
      document.getElementById("scoreText").innerHTML =
        `<strong>${r.acertos}/${r.total}</strong> questões corretas<br>${msgs[r.estrelas]}${melhor}
         <br><small>${escapar(r.personagem.titulo_atual)} · ${r.personagem.total_estrelas} estrelas no total</small>
         <ul class="quiz-correcao">${correcao}</ul>`;
      document.getElementById("quizScore").style.display = "block";
    }

    function fecharQuiz() {
      document.getElementById("modalQuizOverlay").classList.remove("ativo");
      carregarTrilha(); // atualiza estrelas e libera a próxima fase
    }

    carregarTrilha();

    // ── LIBRAS ───────────────────────────────────────────────
    const glossarioLibras = [
      { termo: "Computador",    descricao: "Mãos abertas no peito, dedos movendo como se digitasse.",          link: "computador" },
      { termo: "Programação",   descricao: "Indicador direito 'escreve' sobre a palma da mão esquerda.",       link: "programa%C3%A7%C3%A3o" },
      { termo: "Internet",      descricao: "Dedos entrelaçados girando um ao redor do outro na frente do rosto.", link: "internet" },
      { termo: "Software",      descricao: "Mão em 'S' tocando levemente a palma oposta.",                     link: "software" },
      { termo: "Hardware",      descricao: "Mão espalmada bate suavemente no peito duas vezes.",               link: "hardware" },
      { termo: "Algoritmo",     descricao: "Mão em 'A' move-se em etapas da esquerda para a direita.",         link: "algoritmo" },
      { termo: "Variável",      descricao: "Mão em 'V' balança suavemente — indica algo que muda.",            link: "vari%C3%A1vel" },
      { termo: "Função",        descricao: "Mão em 'F' gira no pulso uma vez.",                                link: "fun%C3%A7%C3%A3o" },
      { termo: "Banco de Dados","descricao": "Palma plana virada para cima, depois mãos empilhando objetos.",  link: "banco+de+dados" },
      { termo: "Rede",          descricao: "Dedos entrelaçados das duas mãos — representa conexão.",           link: "rede" },
    ];

    function abrirLibras() {
      const grid = document.getElementById("librasGrid");
      if (!grid.children.length) {
        glossarioLibras.forEach(item => {
          const card = document.createElement("div");
          card.classList.add("libras-card");
          card.innerHTML = `
            <div class="libras-termo">${item.termo}</div>
            <div class="libras-desc">${item.descricao}</div>
            <a class="libras-link"
               href="https://www.spreadthesign.com/pt.br/search/?q=${item.link}"
               target="_blank" rel="noopener">Ver sinal ↗</a>
          `;
          grid.appendChild(card);
        });
      }
      document.getElementById("modalLibras").classList.add("ativo");
    }

    function fecharLibras() {
      document.getElementById("modalLibras").classList.remove("ativo");
    }

    document.addEventListener("click", e => {
      if (e.target.id === "modalLibras")      fecharLibras();
      if (e.target.id === "modalQuizOverlay") fecharQuiz();
    });
  </script>

</body>
</html>
