<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">

<title>Cadastro · Tronus</title>
  <meta name="description" content="Tronus: plataforma gamificada da UNIP em que cada matéria é um Reino. Responda quizzes, ganhe estrelas e suba de Plebeu a Rei.">
  <meta name="theme-color" content="#1e1308">
  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Tronus">
  <meta property="og:title" content="Tronus · O caminho do herói acadêmico">
  <meta property="og:description" content="Tronus: plataforma gamificada da UNIP em que cada matéria é um Reino. Responda quizzes, ganhe estrelas e suba de Plebeu a Rei.">
  <meta property="og:url" content="https://tronus-one.vercel.app/register">
  <meta property="og:image" content="https://tronus-one.vercel.app/img/og-tronus.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">

</head>

<body>

<div id="sky"></div>

<main class="container">

<form id="registerForm">

<img src="img/logo.png" class="logo" alt="Tronus">

<p id="registerMsg" class="form-msg" role="alert"></p>

<div class="input-box">
<input id="name" placeholder="Nome de usuário (sem espaços)" type="text" autocomplete="username" aria-label="Nome de usuário">
<i class='bx bx-user'></i>
</div>

<div class="input-box">
  <input id="celular" placeholder="Celular (ex: 11999999999)" type="tel" autocomplete="tel" aria-label="Celular">
  <i class='bx bx-phone'></i>
</div>

<div class="input-box">
<input id="email" placeholder="Email" type="email" autocomplete="email" aria-label="E-mail">
<i class='bx bx-envelope'></i>
</div>

<div class="input-box">
<input id="password" placeholder="Senha" type="password" autocomplete="new-password" aria-label="Senha">
<i class='bx bx-lock-alt'></i>
</div>

<div class="input-box">
<input id="confirmPassword" placeholder="Confirmar senha" type="password" autocomplete="new-password" aria-label="Confirmar senha">
<i class='bx bx-lock-alt'></i>
</div>

<p class="form-dica">Senha: mínimo 8 caracteres, com maiúscula, minúscula, número e símbolo.</p>

<button type="submit" class="login" id="registerBtn">Criar conta</button>

<div class="register-link">
<p>Já tem conta? <a href="login.html">Entrar</a></p>
</div>

<a class="voltar-inicio" href="index.html">← Voltar ao início</a>

</form>

</main>

<script src="js/script.js"></script>
<script src="js/api.js"></script>
<script src="js/cadastro.js"></script>

</body>
</html>
