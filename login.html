<!DOCTYPE html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">

<title>Entrar · Tronus</title>
  <meta name="description" content="Tronus: plataforma gamificada da UNIP em que cada matéria é um Reino. Responda quizzes, ganhe estrelas e suba de Plebeu a Rei.">
  <meta name="theme-color" content="#1e1308">
  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Tronus">
  <meta property="og:title" content="Tronus · O caminho do herói acadêmico">
  <meta property="og:description" content="Tronus: plataforma gamificada da UNIP em que cada matéria é um Reino. Responda quizzes, ganhe estrelas e suba de Plebeu a Rei.">
  <meta property="og:url" content="https://tronus-one.vercel.app/login">
  <meta property="og:image" content="https://tronus-one.vercel.app/img/og-tronus.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">

</head>

<body>

<div id="sky"></div>

<main class="container">

<form id="loginForm">

<img src="img/logo.png" class="logo" alt="Tronus">

<p id="loginMsg" class="form-msg" role="alert"></p>

<div class="input-box">
<input id="loginIdentificador" placeholder="Usuário ou Email" type="text" autocomplete="username" aria-label="Usuário ou e-mail">
<i class='bx bx-user'></i>
</div>

<div class="input-box">
<input id="loginPassword" placeholder="Senha" type="password" autocomplete="current-password" aria-label="Senha">
<i class='bx bx-lock-alt'></i>
</div>

<div class="remember">
    <label><input type="checkbox" id="rememberMe" checked> Manter conectado</label>
</div>

<div class="register-link" style="margin-bottom:10px;">
  <p><a href="forgot_password.html">Esqueci minha senha</a></p>
</div>

<button type="submit" class="login" id="loginBtn">Entrar</button>

<div class="register-link">
<p>Não tem uma conta? <a href="register.html">Registrar</a></p>
</div>

<a class="voltar-inicio" href="index.html">← Voltar ao início</a>

</form>

</main>

<script src="js/script.js"></script>
<script src="js/api.js"></script>
<script src="js/login.js"></script>

</body>
</html>
